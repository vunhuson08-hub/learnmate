<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="LearnMate – Gia sư học tập cá nhân: lộ trình theo mục tiêu, bài tập phản hồi ngay, gia sư ảo và theo dõi tiến độ." />
  <meta name="theme-color" content="#4f5bd5" />
  <title>LearnMate — Gia sư học tập cá nhân</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5bd5'/%3E%3Cpath d='M6 11.5 16 7l10 4.5-10 4.5-10-4.5Z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M10 13.8v5.2c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.2' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
  <style>
/* ============ LearnMate – hệ thống thiết kế ============ */
:root {
  --primary: #4f5bd5;
  --primary-hover: #4049b8;
  --primary-soft: #eceefd;
  --primary-text: #3a44a8;
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #f9fafc;
  --text: #1d2233;
  --muted: #586074;
  --border: #e2e5ee;
  --border-strong: #c9cedb;
  --success: #17794c;
  --success-soft: #e6f5ed;
  --error: #b42318;
  --error-soft: #fdecea;
  --warning: #9a5b00;
  --warning-soft: #fdf3e1;
  --info: #2f5fb3;
  --info-soft: #e8f0fc;
  --demo: #7a4bb7;
  --demo-soft: #f3edfb;
  --focus: #4f5bd5;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(20, 24, 40, 0.05), 0 4px 16px rgba(20, 24, 40, 0.05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --tone-blue: #2f6fd6;
  --tone-blue-soft: #e7effc;
  --tone-green: #188055;
  --tone-green-soft: #e4f4ec;
  --tone-amber: #a35f00;
  --tone-amber-soft: #fcf1de;
  --tone-violet: #7048b6;
  --tone-violet-soft: #f1ebfa;
  color-scheme: light;
}

[data-theme="dark"] {
  --primary: #8b94f2;
  --primary-hover: #a1a8f6;
  --primary-soft: #262a4a;
  --primary-text: #b7bdfa;
  --bg: #12141c;
  --surface: #1a1d28;
  --surface-2: #20242f;
  --text: #e9ebf2;
  --muted: #a6adbd;
  --border: #2d3240;
  --border-strong: #3c4253;
  --success: #5fd29a;
  --success-soft: #173326;
  --error: #ff8a80;
  --error-soft: #3a1c1b;
  --warning: #f5c26b;
  --warning-soft: #36290f;
  --info: #8db4ff;
  --info-soft: #1a2741;
  --demo: #c7a6f5;
  --demo-soft: #2c2340;
  --focus: #a1a8f6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  --tone-blue: #8db4ff;
  --tone-blue-soft: #1c2a45;
  --tone-green: #6fd6a4;
  --tone-green-soft: #16322a;
  --tone-amber: #f5c26b;
  --tone-amber-soft: #352914;
  --tone-violet: #c7a6f5;
  --tone-violet-soft: #2c2340;
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg);
}
h1, h2, h3, h4 {
  line-height: 1.25;
  margin: 0 0 0.5rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}
h1 { font-size: clamp(1.5rem, 2.6vw, 1.9rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 0.75rem; }
a { color: var(--primary-text); }
code, pre { font-family: var(--mono); font-size: 0.92em; }
code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.05em 0.35em; }
pre {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.85rem 1rem;
  overflow-x: auto;
  white-space: pre-wrap;
  margin: 0.75rem 0;
}
ul, ol { padding-left: 1.3rem; margin: 0 0 0.75rem; }
li { margin-bottom: 0.25rem; }
.icon { flex-shrink: 0; vertical-align: middle; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}
.skip-link {
  position: absolute;
  left: 1rem;
  top: -100px;
  z-index: 100;
  background: var(--primary);
  color: #fff;
  padding: 0.6rem 1rem;
  border-radius: var(--radius-sm);
}
.skip-link:focus { top: 1rem; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.boot, .noscript { padding: 3rem; text-align: center; color: var(--muted); }

/* ============ Nút ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 44px;
  padding: 0.55rem 1.1rem;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font: inherit;
  font-weight: 600;
  font-size: 0.95rem;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
[data-theme="dark"] .btn-primary { color: #11132a; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--primary); }
.btn-ghost { background: transparent; color: var(--primary-text); }
.btn-ghost:hover { background: var(--primary-soft); }
.btn-danger { background: var(--surface); color: var(--error); border-color: var(--error); }
.btn-danger:hover { background: var(--error-soft); }
.btn-sm { min-height: 36px; padding: 0.35rem 0.75rem; font-size: 0.875rem; }
.btn-lg { min-height: 52px; padding: 0.75rem 1.5rem; font-size: 1.05rem; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary-text); }
.icon-btn[aria-pressed="true"] { color: #d99a00; border-color: #e7c66a; background: #fff8e1; }
[data-theme="dark"] .icon-btn[aria-pressed="true"] { background: #3a3012; }
.icon-btn[aria-pressed="true"] svg { fill: currentColor; }

/* ============ Thẻ, nhãn, tiến độ ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
}
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.card-header h2, .card-header h3 { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  line-height: 1.6;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge-demo { background: var(--demo-soft); color: var(--demo); border-color: color-mix(in srgb, var(--demo) 30%, transparent); }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-muted { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-level { background: var(--primary-soft); color: var(--primary-text); }

.progress { height: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width 0.4s ease; }

.alert {
  display: flex; gap: 0.6rem; align-items: flex-start;
  padding: 0.75rem 1rem; border-radius: var(--radius-sm); border: 1px solid; font-size: 0.95rem;
}
.alert > div { flex: 1; }
.alert p:last-child { margin-bottom: 0; }
.alert-success { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
.alert-error { background: var(--error-soft); color: var(--error); border-color: color-mix(in srgb, var(--error) 35%, transparent); }
.alert-info { background: var(--info-soft); color: var(--info); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.alert-warning { background: var(--warning-soft); color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
.alert-demo { background: var(--demo-soft); color: var(--demo); border-color: color-mix(in srgb, var(--demo) 30%, transparent); }
.alert .alert-text { color: var(--text); }

.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); }
.empty h3 { color: var(--text); margin-top: 0.5rem; }

.subject-icon { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; }
.tone-blue { background: var(--tone-blue-soft); color: var(--tone-blue); }
.tone-green { background: var(--tone-green-soft); color: var(--tone-green); }
.tone-amber { background: var(--tone-amber-soft); color: var(--tone-amber); }
.tone-violet { background: var(--tone-violet-soft); color: var(--tone-violet); }

/* ============ Biểu mẫu ============ */
.field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 1rem; }
.field label, .label { font-weight: 600; font-size: 0.92rem; }
.req { color: var(--error); }
input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], select, textarea {
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.8rem;
  min-height: 44px;
  width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent); outline-offset: 0; border-color: var(--primary); }
input[aria-invalid="true"] { border-color: var(--error); }
.help { font-size: 0.85rem; color: var(--muted); margin: 0; }
.field-error { font-size: 0.85rem; color: var(--error); margin: 0; min-height: 0; }
.field-error:empty { display: none; }

.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.6rem; }
.choice {
  position: relative;
  display: flex; gap: 0.75rem; align-items: center;
  padding: 0.85rem 1rem;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.choice:hover { border-color: var(--primary); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice .choice-title { font-weight: 600; }
.choice .choice-desc { font-size: 0.85rem; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; min-width: 0; }
legend { font-weight: 700; margin-bottom: 0.6rem; padding: 0; font-size: 1rem; }

.segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.segmented label { position: relative; padding: 0.5rem 1rem; cursor: pointer; font-weight: 600; font-size: 0.9rem; min-height: 40px; display: flex; align-items: center; }
.segmented label + label { border-left: 1px solid var(--border-strong); }
.segmented input { position: absolute; opacity: 0; }
.segmented label:has(input:checked) { background: var(--primary); color: #fff; }
[data-theme="dark"] .segmented label:has(input:checked) { color: #11132a; }
.segmented label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: -3px; }

/* ============ Thông báo nổi ============ */
.toasts { position: fixed; z-index: 50; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; max-width: min(420px, calc(100vw - 2rem)); }
.toast {
  display: flex; align-items: center; gap: 0.6rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-left: 4px solid var(--info);
  border-radius: var(--radius-sm); padding: 0.7rem 0.8rem; box-shadow: var(--shadow);
  animation: toast-in 0.2s ease;
}
.toast span { flex: 1; font-size: 0.92rem; }
.toast-success { border-left-color: var(--success); }
.toast-success > .icon { color: var(--success); }
.toast-error { border-left-color: var(--error); }
.toast-error > .icon { color: var(--error); }
.toast-warning { border-left-color: var(--warning); }
.toast-warning > .icon { color: var(--warning); }
.toast.leaving { opacity: 0; transition: opacity 0.35s; }
.toast-close { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ============ Khung ứng dụng ============ */
.app-shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  grid-template-rows: 64px 1fr;
  grid-template-areas: "top top" "side main";
  min-height: 100vh;
}
.topbar {
  grid-area: top;
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0 1.25rem;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.15rem; color: var(--primary-text); text-decoration: none; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
.avatar { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-text); font-weight: 700; text-decoration: none; }
.sidebar {
  grid-area: side;
  position: sticky; top: 64px; align-self: start;
  height: calc(100vh - 64px);
  padding: 1rem 0.75rem;
  border-right: 1px solid var(--border);
  background: var(--surface);
  display: flex; flex-direction: column; gap: 0.25rem;
}
.nav-link {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.65rem 0.85rem; border-radius: var(--radius-sm);
  color: var(--muted); text-decoration: none; font-weight: 600;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--primary-soft); color: var(--primary-text); }
.main { grid-area: main; min-width: 0; outline: none; }
.main-public { outline: none; }
.bottom-nav { display: none; }

.page { max-width: 1160px; margin: 0 auto; padding: 1.75rem 1.5rem 3rem; }
.page-header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
.page-header p { margin: 0; color: var(--muted); }
.grid { display: grid; gap: 1rem; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

@media (max-width: 899px) {
  .app-shell { grid-template-columns: 1fr; grid-template-rows: 60px 1fr; grid-template-areas: "top" "main"; }
  .topbar { padding: 0 1rem; }
  .sidebar { display: none; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr);
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 0.25rem 0.25rem calc(0.25rem + env(safe-area-inset-bottom));
  }
  .bnav-link {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 0.4rem 0.1rem; min-height: 52px; border-radius: 10px;
    color: var(--muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; text-align: center;
  }
  .bnav-link.active { color: var(--primary-text); background: var(--primary-soft); }
  .main { padding-bottom: 76px; }
  .toasts { bottom: 84px; }
  .page { padding: 1.25rem 1rem 2rem; }
  .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 599px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .topbar-demo { font-size: 0.7rem; }
  .card { padding: 1rem; }
}
@media (max-width: 380px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .brand span { display: none; }
}

/* ============ Trang giới thiệu ============ */
.landing-nav { max-width: 1160px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
.landing-nav nav { margin-left: auto; display: flex; gap: 0.5rem; align-items: center; }
.hero { max-width: 1160px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; display: grid; grid-template-columns: 1.05fr 1fr; gap: 3rem; align-items: center; }
.hero h1 { font-size: clamp(2rem, 4.5vw, 3rem); letter-spacing: -0.02em; }
.hero h1 .accent { color: var(--primary-text); }
.hero .lead { font-size: 1.15rem; color: var(--muted); max-width: 34em; }
.eyebrow { display: inline-flex; gap: 0.4rem; align-items: center; font-weight: 700; font-size: 0.85rem; color: var(--primary-text); background: var(--primary-soft); padding: 0.25rem 0.75rem; border-radius: 999px; margin-bottom: 1rem; }
.hero-note { font-size: 0.875rem; color: var(--muted); margin-top: 0.75rem; }
.preview { position: relative; }
.preview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 12px 40px rgba(40, 50, 120, 0.12); padding: 1.25rem; }
.preview-q { font-weight: 600; margin: 0.75rem 0; }
.preview-opt { border: 1.5px solid var(--border-strong); border-radius: 10px; padding: 0.5rem 0.8rem; margin-bottom: 0.45rem; font-size: 0.92rem; }
.preview-opt.ok { border-color: var(--success); background: var(--success-soft); color: var(--success); font-weight: 600; }
.preview-bubble { margin-top: 0.75rem; background: var(--primary-soft); color: var(--primary-text); border-radius: 12px 12px 12px 4px; padding: 0.6rem 0.8rem; font-size: 0.9rem; }
.preview-tag { position: absolute; top: -12px; right: 16px; }
.section { max-width: 1160px; margin: 0 auto; padding: 2.5rem 1.5rem; }
.section-title { text-align: center; max-width: 40em; margin: 0 auto 2rem; }
.section-title p { color: var(--muted); }
.benefit h3 { margin-top: 0.75rem; }
.benefit p { color: var(--muted); margin: 0; }
.steps-list { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(4, 1fr); }
.steps-list li { counter-increment: s; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
.steps-list li::before { content: counter(s); display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; margin-bottom: 0.5rem; }
.cta-band { max-width: 1160px; margin: 1rem auto 3rem; padding: 2rem 1.5rem; text-align: center; background: var(--primary-soft); border-radius: 20px; }
.footer { border-top: 1px solid var(--border); background: var(--surface); }
.footer-inner { max-width: 1160px; margin: 0 auto; padding: 2rem 1.5rem; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 2rem; }
.footer h2 { font-size: 0.95rem; }
.footer ul { list-style: none; padding: 0; }
.footer a { color: var(--muted); text-decoration: none; }
.footer a:hover { color: var(--primary-text); text-decoration: underline; }
.footer-bottom { max-width: 1160px; margin: 0 auto; padding: 0 1.5rem 2rem; font-size: 0.85rem; color: var(--muted); }
@media (max-width: 899px) {
  .hero { grid-template-columns: 1fr; gap: 2rem; padding-top: 1rem; }
  .steps-list { grid-template-columns: 1fr 1fr; }
  .footer-inner { grid-template-columns: 1fr 1fr; }
  .footer-inner > :first-child { grid-column: 1 / -1; }
}
@media (max-width: 599px) {

      ${prof.isDemo ? '<span class="badge badge-demo topbar-demo" title="Bạn đang dùng thử không cần tài khoản">Chế độ demo</span>' : '<span class="badge badge-muted topbar-demo" title="Tài khoản chỉ lưu trên trình duyệt này">Tài khoản demo cục bộ</span>'}
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="${dark ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện tối"}" title="${dark ? "Giao diện sáng" : "Giao diện tối"}">${icon(dark ? "sun" : "moon")}</button>
        <a href="#profile" class="avatar" aria-label="Hồ sơ của ${esc(prof.name)}">${esc((prof.name || "B").trim().charAt(0).toUpperCase())}</a>
      </div>
    </header>
    <nav class="sidebar" aria-label="Điều hướng chính">${navLinks("nav-link")}</nav>
    <main id="main" tabindex="-1" class="main"></main>
    <nav class="bottom-nav" aria-label="Điều hướng chính (di động)">${navLinks("bnav-link")}</nav>
  </div>`;
}

function render() {
  if (cleanup) {
    try {
      cleanup();
    } catch (e) {
      console.error(e);
    }
    cleanup = null;
  }
  const { name, param } = parseHash();
  const route = ROUTES[name];
  const prof = store.currentProfile();

  if (!route) return navigate(prof ? "dashboard" : "home");
  if (route.access === "guest" && prof) return navigate(prof.onboarded ? "dashboard" : "onboarding");
  if ((route.access === "user" || route.access === "app") && !prof) {
    toast("Vui lòng đăng nhập hoặc dùng thử để tiếp tục.", "info");
    return navigate("login");
  }
  if (route.access === "app" && !prof.onboarded) return navigate("onboarding");

  const ctx = { store, navigate, toast, param, route: name, seedDemoProfile, rerender: render };
  let mount;
  if (route.access === "app") {
    appEl.innerHTML = shell(route.nav, prof);
    mount = appEl.querySelector("#main");
    appEl.querySelector("#theme-toggle").addEventListener("click", () => {
      store.setTheme(store.getState().theme === "dark" ? "light" : "dark");
      applyTheme();
      render();
    });
  } else {
    appEl.innerHTML = `<main id="main" tabindex="-1" class="main-public"></main>`;
    mount = appEl.querySelector("#main");
  }

  try {
    cleanup = route.page.render(mount, ctx) || null;
  } catch (err) {
    console.error(err);
    mount.innerHTML = `<div class="page"><div class="card">${icon("alert", { size: 28 })}<h1>Đã xảy ra lỗi khi hiển thị trang</h1><p>Hãy tải lại trang. Nếu lỗi lặp lại, vào Hồ sơ và chọn “Xóa dữ liệu demo”.</p><a class="btn btn-primary" href="#dashboard">Về trang tổng quan</a></div></div>`;
  }
  document.title = `${route.page.title?.(ctx) || "LearnMate"} · LearnMate`;
  window.scrollTo(0, 0);
  // Đưa tiêu điểm vào nội dung chính để người dùng bàn phím/đọc màn hình biết trang đã đổi.
  if (document.activeElement && document.activeElement !== document.body && !mount.contains(document.activeElement)) {
    mount.focus({ preventScroll: true });
  }
}

// Trong khung sandbox (ví dụ khi nhúng trang), trình duyệt có thể chặn việc gửi biểu mẫu gốc
// nên sự kiện submit không bao giờ xảy ra. Ta tự phát sự kiện submit bằng script.
function fireSubmit(form) {
  form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
}
function installFormShim() {
  document.addEventListener(
    "click",
    (e) => {
      const btn = e.target.closest('button[type="submit"], button:not([type]), input[type="submit"]');
      const form = btn?.form;
      if (!form || btn.disabled) return;
      e.preventDefault();
      fireSubmit(form);
    },
    true,
  );
  document.addEventListener(
    "keydown",
    (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      const el = e.target;
      if (!(el instanceof HTMLInputElement) || !el.form) return;
      if (["checkbox", "radio", "button", "submit"].includes(el.type)) return;
      e.preventDefault();
      fireSubmit(el.form);
    },
    true,
  );
}

function boot() {
  installFormShim();
  store.load();
  applyTheme();
  const warning = store.consumeLoadWarning();
  window.addEventListener("hashchange", render);
  document.getElementById("skip-link").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("main")?.focus();
  });
  render();
  if (warning) toast(warning, "warning", 7000);
  if (!store.isPersistent()) toast("Trình duyệt đang chặn lưu trữ cục bộ: dữ liệu sẽ mất khi tải lại trang.", "warning", 7000);
}

window.addEventListener("error", (e) => {
  console.error(e.error || e.message);
});

boot();

return { navigate };
})();
})();
</script>
</body>
</html>
